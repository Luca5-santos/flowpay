name: Validate Flow.pay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and refresh lockfile
        run: npm install
      - name: Collect security report
        run: |
          mkdir -p docs
          npm audit --json > docs/dependency-audit.json || true
      - name: Business rules
        run: npm test
      - name: Production build
        run: npm run build
      - name: Record lockfile and dependency report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json docs/dependency-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record dependency lockfile and security audit'
            git push
          fi
      - name: Security gate
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('docs/dependency-audit.json','utf8')); console.log(r.metadata?.vulnerabilities); if(r.error || !r.metadata || r.metadata.vulnerabilities.total > 0) process.exit(1)"
